<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d75078">
    <title>Dentissa</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <main class="page">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true">D</div>
            <div>
                <p class="eyebrow">Portal del paciente</p>
                <h1>Dentissa</h1>
            </div>
        </header>

        <p id="notice" class="notice" role="status" hidden></p>

        <section id="login-view" class="panel">
            <h2>Iniciar sesión</h2>
            <p class="muted">Ingresa con el usuario y la contraseña que te proporcionó el consultorio.</p>
            <form id="login-form" class="form">
                <label for="username">Usuario</label>
                <input id="username" name="username" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="button" type="submit">Entrar</button>
            </form>
        </section>

        <section id="dashboard-view" hidden>
            <div class="welcome">
                <div>
                    <p class="eyebrow">Mi cuenta</p>
                    <h2 id="patient-name"></h2>
                </div>
                <button id="logout-button" class="button button-secondary" type="button">Salir</button>
            </div>

            <section class="panel">
                <h2>Perfil personal</h2>
                <dl id="patient-profile" class="profile-grid"></dl>
            </section>

            <section id="appointment-summary" class="summary-grid" aria-label="Resumen de citas"></section>

            <section class="panel">
                <h2>Solicitar una cita</h2>
                <p class="muted">El consultorio revisará la solicitud y te confirmará el horario.</p>
                <form id="appointment-form" class="form">
                    <label for="service">Servicio</label>
                    <select id="service" name="service_id" required></select>
                    <label for="date">Fecha</label>
                    <input id="date" name="date" type="date" required>
                    <label for="time">Horario disponible</label>
                    <select id="time" name="time" required disabled>
                        <option value="">Selecciona primero una fecha</option>
                    </select>
                    <button class="button" type="submit">Enviar solicitud</button>
                </form>
            </section>

            <section class="panel">
                <h2>Mis citas</h2>
                <div id="appointments" class="appointments"></div>
            </section>

            <section class="panel">
                <h2>Mis tratamientos</h2>
                <div id="treatments" class="treatments"></div>
            </section>

            <section class="panel">
                <h2>Ofertas activas</h2>
                <div id="offers" class="offers"></div>
            </section>
        </section>
    </main>
</body>
</html>
