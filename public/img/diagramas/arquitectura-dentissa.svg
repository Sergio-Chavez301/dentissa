<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura actual de Dentissa</title>
  <desc id="description">La web pública y la app Android llegan al portal Laravel. La app muestra el portal seguro mediante WebView y usa sesión web. Laravel aplica permisos y consulta la base de datos configurada. La API Sanctum existe aparte y la app actual no registra push.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#806b75"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#34212d}
      .title{font-size:28px;font-weight:700}
      .label{font-size:20px;font-weight:700}
      .small{font-size:16px;fill:#68545f}
      .box{stroke:#eadde2;stroke-width:2}
    </style>
  </defs>
  <rect width="1100" height="510" rx="24" fill="#fff9fb"/>
  <text x="550" y="52" text-anchor="middle" class="title">Un solo portal para la web y la app</text>

  <rect x="45" y="106" width="270" height="124" rx="18" fill="#fff" class="box"/>
  <text x="180" y="147" text-anchor="middle" class="label">Web pública</text>
  <text x="180" y="178" text-anchor="middle" class="small">Información y solicitudes</text>
  <text x="180" y="203" text-anchor="middle" class="small">para visitantes</text>

  <rect x="45" y="270" width="270" height="124" rx="18" fill="#fff" class="box"/>
  <text x="180" y="311" text-anchor="middle" class="label">App Android</text>
  <text x="180" y="342" text-anchor="middle" class="small">Capacitor · WebView</text>
  <text x="180" y="367" text-anchor="middle" class="small">Sesión HTTPS · requiere internet</text>

  <path d="M315 168h108v70h54" fill="none" stroke="#806b75" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M315 332h108v-70h54" fill="none" stroke="#806b75" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="477" y="150" width="300" height="224" rx="22" fill="#d75078"/>
  <text x="627" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Portal Laravel</text>
  <text x="627" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fff">Login y sesión de usuario</text>
  <text x="627" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fff">Paneles según el rol</text>
  <text x="627" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fff">Agenda y expedientes</text>
  <text x="627" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fff">Validación de permisos</text>

  <path d="M777 262h62" fill="none" stroke="#806b75" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="853" y="180" width="210" height="164" rx="18" fill="#fff" class="box"/>
  <text x="958" y="221" text-anchor="middle" class="label">Base de datos</text>
  <text x="958" y="255" text-anchor="middle" class="small">Cuentas y roles</text>
  <text x="958" y="281" text-anchor="middle" class="small">Citas y pacientes</text>
  <text x="958" y="307" text-anchor="middle" class="small">Casos y configuración</text>

  <rect x="116" y="432" width="868" height="48" rx="12" fill="#f3edf0" stroke="#eadde2"/>
  <text x="550" y="453" text-anchor="middle" class="small">API Sanctum separada: la app actual no la consume.</text>
  <text x="550" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#68545f">Push no está activo: el dispositivo Android no registra su token.</text>
</svg>
